name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      # The site serves the normative spec straight out of `spec/`, so editing the
      # specification republishes the site — there is no copy under `website/` to sync.
      - "spec/**"
      - ".github/workflows/website.yml"
  # A pull request builds but does not deploy, so a broken link or a failing build is
  # caught before it reaches main rather than after the deploy job has already run.
  pull_request:
    paths:
      - "website/**"
      - "spec/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Use an ephemeral hosted runner for documentation builds.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Only to READ where the site is published. The deploy job below holds the
      # write half; this one never needs it.
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Asks the Pages API where this site is actually served from, rather than
      # assuming. This follows the repository's configured Pages origin and
      # custom domain without requiring a workflow change.
      #
      # Skipped on a pull request, which has no publish target to ask about: that
      # build exists to prove the site COMPILES and that no internal link is
      # broken, and it is thrown away. Skipping leaves the outputs empty, and the
      # config falls back to the alf.dev defaults — which is also what a
      # contributor gets from `npm start`.
      - name: Resolve the Pages origin
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Install
        working-directory: website
        run: npm ci

      # `onBrokenLinks: throw` makes this the link check too: a relative link between docs
      # that no longer resolves fails here rather than shipping as a 404.
      - name: Build
        working-directory: website
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    # Only main deploys, and that has to say so in the condition rather than in
    # the comment. Excluding pull requests is not the same rule: `workflow_dispatch`
    # takes a `--ref`, so dispatching from any branch satisfied
    # `event_name != 'pull_request'` and published that branch to the production
    # Pages environment.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
